services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-grader
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: grader
      APP_USER_PASSWORD: grader
    ports:
      - "1521:1521"
    volumes:
      - ./oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    shm_size: 1g

# Alternatives if gvenzl image is unavailable:
#   image: container-registry.oracle.com/database/free:latest  (requires registry login)
#   image: container-registry.oracle.com/database/express:21.3.0-xe  (XE 21c)
#
# Note: Oracle Free needs ~2GB RAM and ~6GB disk for the image; first startup
# takes 2-5 minutes while the DB is created. Check readiness with:
#   docker logs -f oracle-grader | grep -i 'DATABASE IS READY'
